<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Favicon crop of icon.svg. Deliberately NOT the same file: the app icon keeps a wide
       safe-zone margin because the manifest declares it maskable, and that margin throws away
       most of the glyph at 16px. Here the bars are scaled up to ~70% width / 55% height so the
       mark still reads in a browser tab. -->
  <rect width="512" height="512" rx="112" fill="#111418"/>
  <g>
    <rect x="76" y="116" width="360" height="64" rx="32" fill="#e5484d"/>
    <rect x="76" y="224" width="264" height="64" rx="32" fill="#f5a524"/>
    <rect x="76" y="332" width="176" height="64" rx="32" fill="#3b82f6"/>
  </g>
</svg>
