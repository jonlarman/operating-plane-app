<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<title>Operating Plane</title>
<!-- Favicon set. The .ico is not legacy cruft: Safari did not support SVG favicons until v26,
     so on any older Safari the .ico is the only thing standing between you and a blank tab.
     Declaration order matters — browsers that understand image/svg+xml take the later, sharper
     SVG; everything else falls back to the .ico above it. -->
<link rel="icon" href="favicon.ico" sizes="32x32" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root{
    --bg:#0f1115; --surface:#181b22; --surface2:#212632; --text:#e8eaef; --muted:#98a2b3; --faint:#6b7480;
    --line:#282e3a; --accent:#5b8cff; --accent-bg:rgba(91,140,255,.16);
    --warn:#f5a524; --warn-bg:rgba(245,165,36,.13); --ask:#9a8cff; --ask-bg:rgba(154,140,255,.13);
    --good:#3fbf7f; --good-bg:rgba(63,191,127,.14);
    --hot:#e5674d; --warm:#f5a524; --cooling:#4a9de5; --on_deck:#9a7cff; --parked:#6b7480; --dead:#4b5563; --stood_down:#8b95a3;
    --radius:12px; --tab:62px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f8; --surface:#fff; --surface2:#eef1f5; --text:#1a1d23; --muted:#5b6573; --faint:#8a93a1; --line:#e4e7ec;
      --accent-bg:rgba(91,140,255,.12); --warn-bg:rgba(245,165,36,.12); --ask-bg:rgba(139,124,255,.11); --good-bg:rgba(63,191,127,.12); }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom))}
  svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:0.5px solid var(--line);
    padding:max(12px,env(safe-area-inset-top)) 16px 11px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.01em}
  header .r{display:flex;gap:6px;color:var(--muted)}
  header button{background:none;border:none;color:var(--muted);padding:6px;cursor:pointer}
  /* pipeline heartbeat: age of the last sync run, straight from the repo */
  #syncpill{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:0.5px solid var(--line);
    border-radius:999px;padding:4px 9px;margin-right:2px;font-family:inherit;font-size:11px;font-weight:600;color:var(--muted)}
  #syncpill .sdot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  #syncpill.ok .sdot{background:var(--good)} #syncpill.ok{color:var(--good)}
  #syncpill.warn .sdot{background:var(--warn)} #syncpill.warn{color:var(--warn)}
  #syncpill.bad .sdot{background:var(--hot)} #syncpill.bad{color:var(--hot)}
  main{padding:14px 15px 8px;max-width:640px;margin:0 auto}
  /* today */
  .dhead{font-size:20px;font-weight:600;line-height:1.25;margin:2px 0 0}
  .orient{color:var(--muted);font-size:14px;line-height:1.55;margin:6px 0 0}
  .counts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
  .pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
  .sec{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600;margin:24px 0 9px}
  .sec svg{width:18px;height:18px}
  .sec .n{margin-left:auto;font-size:12px;font-weight:400;color:var(--faint)}
  .card{background:var(--surface);border:0.5px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:9px}
  .tom{display:flex;gap:11px}
  .rank{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-bg);color:var(--accent);
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .t{font-size:15px;font-weight:600;line-height:1.4;margin:0}
  .why{color:var(--muted);font-size:13px;line-height:1.55;margin:4px 0 0}
  .lnk{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12px;margin-top:8px}
  .lnk svg{width:13px;height:13px}
  .rows{background:var(--surface);border:0.5px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .grp{font-size:12px;font-weight:600;color:var(--faint);padding:11px 13px 3px}
  .row{display:flex;gap:11px;padding:11px 13px;border-top:0.5px solid var(--line);align-items:flex-start}
  .grp + .row{border-top:none}
  .rows > .row:first-child{border-top:none}
  .rb{flex:1;min-width:0}
  .cb{color:var(--muted);cursor:pointer;margin-top:1px}
  .cb svg{width:20px;height:20px}
  .cb.done{color:var(--accent)}
  .row p{margin:0;font-size:14px;line-height:1.45}
  .row .whyin{color:var(--muted)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--faint);
    background:var(--surface2);border-radius:999px;padding:4px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip.ok{color:var(--good);background:var(--good-bg)}
  .chip svg{width:12px;height:12px}
  .tagbtn{display:inline-flex;align-items:center;gap:4px;font-family:inherit;font-size:11.5px;font-weight:600;
    border:0.5px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:4px 10px;cursor:pointer}
  .tagbtn.ghost{border-color:var(--line);background:var(--surface2);color:var(--muted);font-weight:500}
  .tagbtn svg{width:13px;height:13px}
  .legend{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted);
    background:var(--warn-bg);border-radius:10px;padding:9px 11px;margin:0 0 9px}
  .legend svg{width:14px;height:14px;color:var(--warn);margin-top:3px}
  .legend b{color:var(--text);font-weight:600}
  .soft .lineitem{margin:8px 0 0;font-size:13.5px;line-height:1.55;color:var(--text)}
  .eye{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 9px;padding-left:12px;border-left:2px solid var(--line)}
  .miss{display:flex;gap:11px;border-color:var(--warn-bg)}
  .miss > svg{width:18px;height:18px;color:var(--warn);margin-top:1px}
  .mt{font-size:14px;font-weight:600;line-height:1.4;margin:0}
  .ask{background:var(--surface);border:0.5px solid var(--line);border-radius:var(--radius);padding:11px 13px;margin-bottom:9px}
  .ask.answered{border-color:var(--good)}
  .ah{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ask);margin-bottom:6px}
  .ah svg{width:15px;height:15px}
  .aq{margin:0;font-size:14px;line-height:1.5}
  .reply{display:flex;gap:7px;margin-top:10px}
  .reply[hidden]{display:none}
  /* 16px minimum on every field: anything smaller makes iOS Safari zoom the page on focus */
  .reply input{flex:1;min-width:0;background:var(--surface2);border:0.5px solid var(--line);border-radius:9px;
    padding:9px 11px;color:var(--text);font-family:inherit;font-size:16px;line-height:1.35}
  .send{background:var(--accent);border:none;border-radius:9px;color:#fff;padding:0 13px;cursor:pointer;display:flex;align-items:center}
  .send svg{width:16px;height:16px;stroke:#fff}
  /* sent history */
  .sent{margin-top:9px;display:flex;flex-direction:column;gap:7px}
  .sent:empty{display:none}
  .sentitem{background:var(--good-bg);border-left:2px solid var(--good);border-radius:0 8px 8px 0;padding:7px 10px}
  .sentitem .sm{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--good);font-weight:600}
  .sentitem .sm svg{width:12px;height:12px}
  .sentitem p{margin:3px 0 0;font-size:13.5px;line-height:1.45;color:var(--text)}
  details.logwrap{margin-top:8px;color:var(--muted)}
  details.logwrap summary{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;list-style:none;color:var(--faint)}
  details.logwrap summary svg{width:16px;height:16px}
  details.logwrap summary::-webkit-details-marker{display:none}
  .logitem{font-size:13px;line-height:1.6;color:var(--muted);margin:8px 0 0}
  .banner{display:flex;gap:9px;background:var(--warn-bg);border-radius:var(--radius);padding:11px 13px;margin:12px 0 0;font-size:13px;line-height:1.5}
  .banner svg{width:18px;height:18px;color:var(--warn)}
  .wl{color:var(--accent)}
  a{color:var(--accent);text-decoration:none}
  #today-comment,#cap{width:100%;background:var(--surface);border:0.5px solid var(--line);border-radius:var(--radius);
    padding:11px 12px;color:var(--text);font-family:inherit;font-size:16px;line-height:1.5;resize:vertical}
  #today-comment{min-height:70px}
  #cap{min-height:120px}
  /* voice note recorder */
  .recbtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;
    background:var(--surface);border:0.5px solid var(--line);border-radius:var(--radius);
    color:var(--text);font-family:inherit;font-size:16px;font-weight:600;cursor:pointer}
  .recbtn svg{color:var(--hot)}
  .reclive{display:flex;align-items:center;gap:11px;background:var(--surface);border:0.5px solid var(--hot);
    border-radius:var(--radius);padding:13px 15px}
  .recdot{width:11px;height:11px;border-radius:50%;background:var(--hot);flex:none;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .rectime{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .recstop{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--hot);border:none;
    border-radius:9px;color:#fff;font-family:inherit;font-size:14px;font-weight:600;padding:9px 14px;cursor:pointer}
  .recstop svg{stroke:#fff;color:#fff}
  .rechint{font-size:12.5px;line-height:1.5;color:var(--muted);margin:8px 2px 0}
  .rechint.warn{color:var(--warn)}
  .recreview{background:var(--surface);border:0.5px solid var(--line);border-radius:var(--radius);padding:12px}
  .recreview audio{width:100%;display:block}
  .recrow{display:flex;gap:8px;margin-top:11px}
  .ghostbtn{background:var(--surface2);border:none;border-radius:10px;color:var(--muted);
    font-family:inherit;font-size:14px;padding:10px 13px;cursor:pointer}
  .row2{display:flex;margin-top:9px}
  button.primary{background:var(--accent);border:none;border-radius:10px;color:#fff;font:inherit;font-weight:600;padding:10px 14px;cursor:pointer;flex:1}
  /* priority */
  .bkt{display:flex;align-items:center;gap:8px;margin:16px 0 6px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%}
  /* compact rows: title + next trigger only. Everything else lives in the tap-through sheet. */
  .pgroup{background:var(--surface);border:0.5px solid var(--line);border-left:3px solid var(--line);
    border-radius:var(--radius);overflow:hidden;margin:0 0 4px}
  .prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
    border-top:0.5px solid var(--line);padding:11px 12px;color:var(--text);font-family:inherit;cursor:pointer}
  .pgroup .prow:first-child{border-top:none}
  .prow:active{background:var(--surface2)}
  .prow .pw{flex:1;min-width:0}
  .prow .pt2{display:block;font-size:14px;font-weight:600;line-height:1.35}
  .prow .pnx{display:block;font-size:12px;color:var(--muted);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow .pnx.none{color:var(--faint)}
  .prow > svg{width:16px;height:16px;color:var(--faint)}
  .flag{color:var(--warn)}
  /* topic detail sheet */
  /* stacked label/value: the status blobs need the full width */
  .dl{padding:10px 0;border-top:0.5px solid var(--line)}
  .dl:first-child{border-top:none;padding-top:4px}
  .dk{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    color:var(--faint);margin-bottom:3px}
  .dv{display:block;font-size:14px;line-height:1.5}
  /* register status blobs run to thousands of characters — clamp, with a way to open them */
  .clamp{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
  .morebtn{margin-top:6px;background:none;border:none;color:var(--accent);
    font-family:inherit;font-size:13px;font-weight:600;padding:0;cursor:pointer}
  .empty{color:var(--muted);text-align:center;padding:44px 16px;line-height:1.6}
  /* review queue */
  .rvhead{display:flex;align-items:baseline;gap:8px;margin:0 0 12px}
  .rvhead b{font-size:20px;font-weight:600}
  .rvhead span{font-size:13px;color:var(--muted)}
  .rvcard{display:block;width:100%;text-align:left;background:var(--surface);border:0.5px solid var(--line);
    border-radius:var(--radius);padding:12px 13px;margin-bottom:9px;color:var(--text);font-family:inherit;cursor:pointer}
  .rvcard:active{background:var(--surface2)}
  .rvcard.done{opacity:.55;border-color:var(--good)}
  .rvtop{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .rvage{margin-left:auto;font-size:11px;color:var(--faint);flex:none}
  .rvage.old{color:var(--warn)}
  .rvt{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
  .rvq{display:block;font-size:13px;color:var(--muted);line-height:1.5;margin-top:5px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  /* rendered markdown inside the review sheet */
  .md{font-size:14px;line-height:1.55}
  .md .mdh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--faint);margin:16px 0 5px}
  .md .mdh:first-child{margin-top:0}
  .md .mdp{margin:0 0 9px}
  .md .mdul{margin:0 0 9px;padding-left:19px}
  .md .mdul li{margin:0 0 5px}
  .md .mdq{border-left:2px solid var(--line);padding-left:11px;color:var(--muted);margin:0 0 9px}
  .md .mdtask{margin:0 0 7px;color:var(--muted)}
  .md code{background:var(--surface2);border-radius:4px;padding:1px 5px;font-size:12.5px}
  .md s{color:var(--faint)}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 9px}
  .preset{font-family:inherit;font-size:12px;background:var(--surface2);border:0.5px solid var(--line);
    border-radius:999px;color:var(--muted);padding:6px 11px;cursor:pointer}
  #rv-answer{width:100%;min-height:90px;background:var(--surface2);border:0.5px solid var(--line);
    border-radius:10px;padding:11px;color:var(--text);font-family:inherit;font-size:16px;line-height:1.5;resize:vertical}
  .rvfoot{font-size:11.5px;color:var(--faint);line-height:1.5;margin:9px 0 0}
  /* sent view */
  .daylbl{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 7px}
  .scard{background:var(--surface);border:0.5px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
  .scard .sh{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--accent)}
  .scard .sh .tm{margin-left:auto;font-weight:400;color:var(--faint)}
  .scard .stg{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45}
  .scard .stx{font-size:14px;margin-top:5px;line-height:1.45}
  .clearbtn{width:100%;margin:18px 0 6px;background:var(--surface2);border:0.5px solid var(--line);border-radius:10px;
    color:var(--muted);font-family:inherit;font-size:14px;padding:11px;cursor:pointer}
  /* tabs */
  .tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:0.5px solid var(--line);display:flex;z-index:6}
  .tabs button{flex:1;border:none;background:none;color:var(--faint);font-size:11px;font-weight:500;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;cursor:pointer}
  .tabs button svg{width:22px;height:22px}
  .tabs button.on{color:var(--accent)}
  dialog{border:none;border-radius:16px;background:var(--surface);color:var(--text);padding:18px;
    width:min(92vw,420px);max-height:82vh;overflow:auto}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog h3{margin:0 0 6px}
  dialog label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  dialog input{width:100%;background:var(--surface2);border:0.5px solid var(--line);border-radius:9px;padding:10px;color:var(--text);font-family:inherit;font-size:16px}
  .drow{display:flex;gap:8px;margin-top:14px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 20px);background:var(--surface2);
    border:0.5px solid var(--line);border-radius:999px;padding:9px 18px;font-size:14px;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none}
  .toast.show{opacity:1}
  /* a receipt that came from the OTHER device (or from the applied history), not this one */
  .sentitem.remote{background:var(--accent-bg);border-left-color:var(--accent)}
  .sentitem.remote .sm{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* ---- wide screens -------------------------------------------------------
     Same app, same single column. The bottom thumb bar becomes a left rail and the
     column gets a little wider — that is the whole desktop story on purpose. The old
     Executive Dashboard failed because it put everything on one screen at once; a
     multi-column desktop build of this would rebuild exactly that problem. Density is
     the bug, not the goal. Breakpoint is 900px so iPad portrait (834) keeps the touch
     tab bar and only landscape/desktop gets the rail. */
  @media (min-width:900px){
    /* main is a centered 760px column in the space left of the rail, so the header needs the
       same offset or the title and the sync pill float off the column's edges.
       (100vw - rail - column) / 2 is exactly where main's left edge lands. */
    /* box-sizing is border-box, so main's 760px box carries its own 26px padding: the header
       has to clear the centering offset PLUS that padding to line up with the actual text. */
    :root{--rail:212px; --col:760px;
      --gut:max(26px, calc((100vw - var(--rail) - var(--col)) / 2 + 26px))}
    body{padding-bottom:0;padding-left:var(--rail)}
    header{padding:15px var(--gut) 13px}
    header h1{font-size:19px}
    .tabs{top:0;bottom:0;right:auto;width:var(--rail);height:100vh;height:100dvh;
      flex-direction:column;align-items:stretch;gap:2px;padding:14px 10px;
      border-top:none;border-right:0.5px solid var(--line);background:var(--bg)}
    .tabs::before{content:"Operating Plane";display:block;font-size:11px;font-weight:700;
      letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:8px 12px 16px}
    .tabs button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:11px;
      font-size:14px;font-weight:500;padding:9px 12px;border-radius:9px}
    .tabs button svg{width:19px;height:19px}
    .tabs button.on{background:var(--accent-bg)}
    main{max-width:var(--col);padding:20px 26px 64px}
    .toast{left:calc(50% + (var(--rail) / 2));bottom:26px}
    dialog{width:min(88vw,560px);max-height:86vh}
    #review{width:min(88vw,680px)}
    #cap{min-height:170px}
  }
  @media (hover:hover){
    .prow:hover,.rvcard:hover{background:var(--surface2)}
    .tabs button:hover{color:var(--text)}
    header button:hover,.cb:hover{color:var(--text)}
    .tagbtn:hover,.preset:hover,.ghostbtn:hover,.clearbtn:hover{filter:brightness(1.18)}
    button.primary:hover,.send:hover{filter:brightness(1.08)}
  }
</style>
</head>
<body>
<header>
  <h1 id="htitle">Today</h1>
  <div class="r">
    <button id="syncpill" aria-label="Pipeline status"><span class="sdot"></span><span id="sync-age">–</span></button>
    <button id="reload" aria-label="Reload"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M19 4v4h-4"/></svg></button>
    <button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M4.2 7.5l2.6 1.5M17.2 15l2.6 1.5M4.2 16.5l2.6-1.5M17.2 9l2.6-1.5"/></svg></button>
  </div>

  <label>GitHub owner (username)</label><input id="cfg-owner" autocomplete="off" />
  <label>Repo name</label><input id="cfg-repo" value="operating-plane" autocomplete="off" />

  <div class="drow"><button class="primary" id="cfg-save">Save &amp; sync</button><button id="cfg-close" style="background:var(--surface2);border:none;border-radius:10px;color:var(--text);padding:10px 14px;font:inherit;cursor:pointer">Close</button></div>

<script>
const $=s=>document.querySelector(s);
const cfg=()=>({owner:localStorage.op_owner||"",repo:localStorage.op_repo||"operating-plane",token:localStorage.op_token||""});
const have=()=>{const c=cfg();return c.owner&&c.repo&&c.token;};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);};
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const att=s=>esc(s).replace(/"/g,"&quot;");
const keyOf=s=>{let h=0;const t=(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"");
  for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return "k"+(h>>>0).toString(36);};

// icons
const P={
  target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',
  check:'<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/>',
  eye:'<path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.4"/>',
  alert:'<path d="M12 4l8.5 15h-17z"/><path d="M12 10v4"/><path d="M12 16.6v.01"/>',
  chat:'<path d="M4.5 5.5h15v10h-9l-4 3.5v-3.5h-2z"/>',
  pencil:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>',
  history:'<path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 5v4h4"/><path d="M12 8v4l3 1.6"/>',
  square:'<rect x="4.5" y="4.5" width="15" height="15" rx="4"/>',
  checkfill:'<rect x="4.5" y="4.5" width="15" height="15" rx="4" fill="currentColor" stroke="none"/><path d="M8.5 12.2l2.4 2.4 4.6-5" stroke="#fff"/>',
  arrow:'<path d="M5 12h13"/><path d="M13 6.5l5.5 5.5-5.5 5.5"/>',
  spark:'<path d="M12 4l1.8 5.2L19 11l-5.2 1.8L12 18l-1.8-5.2L5 11l5.2-1.8z"/>',
  bolt:'<path d="M13 3L5.5 13.5H12l-1 7.5L18.5 10.5H12z"/>',
  plane:'<path d="M4 11.5L20 4l-7.5 16-2-6.5z"/><path d="M10.5 13.5L20 4"/>',
  chev:'<path d="M9.5 6l6 6-6 6"/>',
  mic:'<path d="M12 4a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V7a3 3 0 0 1 3-3z"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18.5V21"/>',
  stop:'<rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" stroke="none"/>'
};
const ic=(n,s=18)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}">${P[n]||""}</svg>`;

// inline md
function inline(s){
  s=esc(s);
  s=s.replace(/\[\[([^\]]+)\]\]/g,(_,m)=>`<span class="wl">${m.split("|").pop()}</span>`);
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/~~([^~]+)~~/g,"<s>$1</s>");
  s=s.replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  return s;
}
const plain=s=>(s||"").replace(/\*\*/g,"").replace(/\[\[([^\]]+)\]\]/g,(_,m)=>m.split("|").pop());

// ---- local outbox -------------------------------------------------------
// Every intent this phone sends is recorded here so a reply never just vanishes.
// The vault round-trip is slow (sync job -> orchestrator -> tomorrow's brief),
// so the phone keeps its own receipt and renders it under the item it answered.
const OB="op_sent";
function outbox(){try{const v=JSON.parse(localStorage[OB]||"[]");return Array.isArray(v)?v:[]}catch{return[]}}
function outboxWrite(l){const cut=Date.now()-1000*60*60*24*45;
  localStorage[OB]=JSON.stringify(l.filter(e=>e.ts>cut).slice(-400));}
function recordSent(e){const l=outbox();l.push({ts:Date.now(),...e});outboxWrite(l);}

// ---- shared receipts (cross-device) -------------------------------------
// The local outbox above is THIS device's receipt, and on its own it is not enough.
// A phone reply is appended to the daily note under "## Phone inbox", which sits below
// the "# Reference" divider — and pushReadState() cuts the note at that divider. So a
// reply sent from the phone never comes back down in today.md, on any device, ever.
// Without the two feeds below the Mac cannot know the phone already answered a card,
// and the same [!ask] gets answered twice (replies have no idempotency guard the way
// review_resolve does). Two sources, merged into the same lookup every renderer uses:
//   receipts.json — written by sync-job.mjs from processed/: every intent it has APPLIED.
//   inbox/*.json  — intents sent but not yet applied. Small; the job drains it every ~12min.
//                   This is the feed that closes the double-answer window.
// Both carry the `key` the SENDING device computed, so cards match without re-deriving
// keyOf() in Node. One hash implementation, in the browser, is the point.
let REMOTE=[];
const INBOX_CAP=40;   // if inbox is ever deeper than this the pipeline is stalled anyway
function remoteCache(){try{const v=JSON.parse(localStorage.op_remote||"[]");return Array.isArray(v)?v:[]}catch{return[]}}
async function loadRemote(){
  const out=[];
  try{const r=JSON.parse(await ghGet("receipts.json"));
    if(r&&Array.isArray(r.items))for(const e of r.items)
      if(e&&e.key)out.push({id:e.id,key:e.key,type:e.type,label:e.label||"",text:e.text||"",
        ts:Date.parse(e.ts)||0,remote:true});
  }catch{}
  try{
    const list=await ghList("inbox");
    const js=list.filter(f=>f.type==="file"&&f.name.endsWith(".json")).slice(0,INBOX_CAP);
    const got=await Promise.all(js.map(f=>ghGet(`inbox/${f.name}`).then(JSON.parse).catch(()=>null)));
    for(const e of got)if(e&&e.key)out.push({id:e.id,key:e.key,type:e.type,label:e.label||e.target||"",
      text:e.text||"",ts:Date.parse(e.ts)||0,remote:true,pending:true});
  }catch{}
  REMOTE=out;
  try{localStorage.op_remote=JSON.stringify(out.slice(-400));}catch{}
}
// Local wins on collision: this device's own copy has the truthful local timestamp.
// Two dedupe passes, and the second one is not optional. `recordSent` only started storing
// `id` on 2026-07-27, so every outbox entry written before that has no id, can never match
// its own receipt coming back in receipts.json, and would render TWICE on the device that
// sent it — once local, once remote — for the full 45-day retention window. Those fall back
// to a content signature. Keyed on key+type+text, not ts: the local clock stamp and the
// intent's ISO ts are written at different moments and do not agree.
const sigOf=e=>`${e.key||""}|${e.type||""}|${(e.text||"").trim()}`;
function allSent(){
  const local=outbox();
  const ids=new Set(local.map(e=>e.id).filter(Boolean));
  const sigs=new Set(local.filter(e=>!e.id).map(sigOf));
  return local.concat(REMOTE.filter(e=>!(e.id&&ids.has(e.id))&&!sigs.has(sigOf(e))));
}
function sentFor(k){return allSent().filter(e=>e.key===k).sort((a,b)=>(a.ts||0)-(b.ts||0));}
const fmtT=ts=>new Date(ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const fmtD=ts=>new Date(ts).toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"});
const SENTLBL={reply:"You replied",comment:"Your note",phone_this:"Pushed to Todoist",complete:"Marked done",capture:"Captured",voice:"Voice note",review:"Review resolved"};
function sentInner(k){
  return sentFor(k).map(e=>{
    const old=new Date(e.ts).toDateString()!==new Date().toDateString();
    // Say WHERE it came from. "You already answered this from the other device" is the
    // whole reason this card is not blank, and it is the thing that stops a second answer.
    const src=e.remote?` · ${e.pending?"other device, pending sync":"other device"}`:"";
    return `<div class="sentitem${e.remote?" remote":""}"><span class="sm">${ic("check",12)} ${
      SENTLBL[e.type]||"Sent"} · ${
      old?new Date(e.ts).toLocaleDateString([],{month:"short",day:"numeric"})+" ":""}${fmtT(e.ts)}${src}</span>${
      e.text?`<p>${esc(e.text)}</p>`:""}</div>`;}).join("");
}
function refreshSent(k){document.querySelectorAll(`[data-sent="${k}"]`).forEach(n=>n.innerHTML=sentInner(k));
  if(!$("#view-sent").hidden)renderSentView();}

// GitHub
async function ghGet(p){const c=cfg();const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${p}?t=${Date.now()}`,
  {headers:{Authorization:`Bearer ${c.token}`,Accept:"application/vnd.github.raw"}});if(!r.ok)throw new Error(r.status+"");return await r.text();}
// Directory listing. Needs the JSON accept header: the raw one is for blobs.
// A 404 here is normal and expected — inbox/ does not exist until the first intent is sent.
async function ghList(p){const c=cfg();const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${p}?t=${Date.now()}`,
  {headers:{Authorization:`Bearer ${c.token}`,Accept:"application/vnd.github+json"}});
  if(!r.ok)throw new Error(r.status+"");const j=await r.json();return Array.isArray(j)?j:[];}
async function ghPut(p,content,message){const c=cfg();const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${p}`,
  {method:"PUT",headers:{Authorization:`Bearer ${c.token}`,Accept:"application/vnd.github+json"},body:JSON.stringify({message,content:b64(content)})});
  if(!r.ok)throw new Error(r.status+"");}
// Binary upload: the Contents API wants raw base64 of the bytes, not utf-8-then-btoa.
async function ghPutB64(p,b64content,message){const c=cfg();
  const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${p}`,
  {method:"PUT",headers:{Authorization:`Bearer ${c.token}`,Accept:"application/vnd.github+json"},
   body:JSON.stringify({message,content:b64content})});
  if(!r.ok)throw new Error(r.status+"");}
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();
  r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=()=>rej(new Error("read"));r.readAsDataURL(b);});
// Same filename shape the Shortcut drop uses, so downstream handling is identical.
function stampName(){const d=new Date(),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;}

// Returns the intent id. Callers MUST pass it to recordSent() and MUST set `key`:
// the id is what dedupes this device's local receipt against the same intent coming
// back down in receipts.json, and the key is what ties the receipt to a card on the
// OTHER device. An intent sent without a key still applies to the vault fine, it just
// goes invisible everywhere except the sending device's Sent tab.
async function sendIntent(intent){if(!have()){openSettings();throw new Error("nocfg");}
  const id=`${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
  await ghPut(`inbox/${id}.json`,JSON.stringify({id,ts:new Date().toISOString(),...intent},null,2),`intent: ${intent.type}`);
  return id;}

// ---- Today renderer ----
function collectItems(lines){const out=[];let cur=null;
  for(const ln of lines){const m=ln.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if(m){if(cur!=null)out.push(cur);cur=m[1];}else if(cur!=null&&ln.trim())cur+=" "+ln.trim();}
  if(cur!=null)out.push(cur);return out;}

function splitTom(t){
  const b=t.match(/\*\*(.+?)\*\*/);const title=b?b[1]:t;let rest=b?t.slice(b.index+b[0].length):"";
  const links=[...rest.matchAll(/\[\[([^\]]+)\]\]/g)];const link=links.length?links[links.length-1][1].split("|").pop():"";
  let why=rest.replace(/\s*(?:→|->)\s*\[\[[^\]]+\]\]\s*$/,"").replace(/\[\[([^\]]+)\]\]/g,(_,m)=>m.split("|").pop());
  why=why.replace(/^[\s—\-.:]+/,"").trim();return{title,why,link};}

function renderToday(md){
  const counts=(md.match(/board_counts:\s*"([^"]+)"/)||[])[1]||"";
  md=md.split(/\n#\s*Reference\b/)[0].replace(/^---[\s\S]*?---\s*/,"");
  const lines=md.split("\n");const segs=[];let cur=null;
  for(const ln of lines){const h=ln.match(/^(#{1,3})\s+(.*)/);
    if(h){cur={lvl:h[1].length,head:h[2].trim(),body:[]};segs.push(cur);}else if(cur)cur.body.push(ln);}
  let html="";
  for(const s of segs){
    const h=s.head.toLowerCase();
    if(/^alert/i.test(s.head)){html+=`<div class="banner">${ic("alert")}<div>${inline(s.body.join(" ").trim())||esc(s.head)}</div></div>`;continue;}
    if(s.lvl===1){const orient=s.body.find(l=>l.trim())||"";
      html+=`<h2 class="dhead">${esc(s.head)}</h2>${orient?`<p class="orient">${inline(orient)}</p>`:""}`;
      if(counts)html+=pills(counts);continue;}
    if(h.includes("top of mind"))html+=sec("target","Top of mind",tom(s.body));
    else if(h.includes("act now"))html+=sec("check","Act now",actNow(s.body));
    else if(h.includes("act when you can"))html+=sec("clock","This week",softCard(s.body));
    else if(h.includes("keep an eye on"))html+=sec("eye","Keep an eye on",eyeList(s.body));
    else if(h.includes("might have missed"))html+=sec("alert","You might have missed",missed(s.body),collectItems(s.body).length);
    else if(h.includes("stood down"))html+=sec("history","Stood down",eyeList(s.body));
    else if(h.includes("let's talk")||h.includes("lets talk"))html+=sec("chat","Let's talk",asks(s.body));
    else if(h.includes("drop a comment"))html+=sec("pencil","Drop a comment",
      `<textarea id="today-comment" placeholder="Flag anything — it lands in the vault…"></textarea>`+
      `<div class="row2"><button class="primary" id="tc-send">Send comment</button></div>`+
      `<div class="sent" data-sent="__comment">${sentInner("__comment")}</div>`);
    else if(h.includes("today's log")||h.includes("todays log"))html+=`<details class="logwrap"><summary>${ic("clock",16)} Today's log</summary>${collectItems(s.body).map(i=>`<p class="logitem">${inline(i)}</p>`).join("")}</details>`;
  }
  return html||'<div class="empty">Nothing to show. Tap ↻ or ⚙.</div>';
}
const sec=(icn,label,content,n)=>`<div class="sec">${ic(icn)}<span>${label}</span>${n?`<span class="n">${n}</span>`:""}</div>${content}`;
function pills(c){const L=["hot","warm","cooling","on deck","parked","dead"];
  return `<div class="counts">${c.split("/").map((n,i)=>i<4&&n.trim()?`<span class="pill">${n.trim()} ${L[i]}</span>`:"").join("")}</div>`;}
function tom(body){const its=collectItems(body);return its.map((it,i)=>{const{title,why,link}=splitTom(it);
  return `<div class="card tom"><span class="rank">${i+1}</span><div><p class="t">${inline(title)}</p>${why?`<p class="why">${inline(why)}</p>`:""}${link?`<span class="lnk">${ic("arrow",13)} ${esc(link)}</span>`:""}</div></div>`;}).join("");}

// --- Act now -------------------------------------------------------------
// A brief line looks like:
//   - **Do the thing.** why it matters → [[Project - X]] · ⚡ not in Todoist
//   - **Do the thing.** why it matters → [[Project - X]] · ✓ in Todoist
// Everything after a "·" is a machine tag. Strip the tags out of the prose and
// turn them into controls, so the item explains itself and is actionable here.
function parseAct(raw){
  let txt=raw.trim(),done=false;
  const cbm=txt.match(/^\[( |x)\]\s+/i);
  if(cbm){done=cbm[1].toLowerCase()==="x";txt=txt.slice(cbm[0].length);}
  let inTodoist=false,notPhone=false,topic="",link="";
  const parts=txt.split(/\s+·\s+/);
  let main=parts.shift()||"";
  for(const p of parts){
    if(/not\s+(?:on your phone|in\s*todoist|projected)/i.test(p))notPhone=true;
    else if(/in\s*todoist/i.test(p))inTodoist=true;
    else if(/^_?topic:/i.test(p))topic=plain(p.replace(/^_?topic:\s*/i,"").replace(/_\s*$/,""));
    else if(p.trim()&&!topic)topic=plain(p.trim());
  }
  const lm=main.match(/\s*(?:→|->)\s*\[\[([^\]]+)\]\]\s*$/);
  if(lm){link=lm[1].split("|").pop();main=main.slice(0,lm.index);}
  const b=main.match(/\*\*(.+?)\*\*/);
  const title=(b?b[1]:main).trim();
  // keep a leading em dash: "**Title** — why" reads wrong without it
  const why=(b?main.slice(b.index+b[0].length):"").replace(/^[\s:]+/,"").trim();
  const pl=plain(title).replace(/\s+/g," ").trim();
  return{done,inTodoist,notPhone,topic,link,title,why,plain:pl,k:keyOf(pl)};
}
function pushCtl(it){
  return sentFor(it.k).some(e=>e.type==="phone_this")
    ? `<span class="chip ok">${ic("check",12)} Queued for Todoist</span>`
    : `<button class="tagbtn" data-push="${att(it.plain)}" data-key="${it.k}">${ic("bolt",13)} Add to Todoist</button>`;
}
function actRow(it){
  return `<div class="row" data-key="${it.k}">
    <span class="cb ${it.done?"done":""}" data-done="${att(it.plain)}" data-key="${it.k}">${ic(it.done?"checkfill":"square",20)}</span>
    <div class="rb">
      <p><strong>${inline(it.title)}</strong>${it.why?` <span class="whyin">${inline(it.why)}</span>`:""}</p>
      <div class="meta">
        ${it.link?`<span class="chip">${ic("arrow",12)} ${esc(it.link)}</span>`:""}
        ${it.topic?`<span class="chip">${esc(it.topic)}</span>`:""}
        ${it.inTodoist?`<span class="chip ok">${ic("check",12)} In Todoist</span>`:""}
        ${it.notPhone?pushCtl(it):""}
        <button class="tagbtn ghost" data-note="${it.k}">${ic("pencil",13)} Reply</button>
      </div>
      <div class="sent" data-sent="${it.k}">${sentInner(it.k)}</div>
      <div class="reply" data-nf="${it.k}" hidden>
        <input placeholder="Add a note…" data-target="${att(it.plain)}" data-key="${it.k}" />
        <button class="send" data-send-note>${ic("arrow",16)}</button>
      </div>
    </div>
  </div>`;
}
function actNow(body){
  const flat=[],intro=[];let cur=null;
  for(const ln of body){
    if(/^\s*(?:[-*]|\d+\.)\s+/.test(ln)){if(cur!=null)flat.push(cur);cur=ln;}
    else if(/^\*\*.+\*\*:?\s*$/.test(ln.trim())){if(cur!=null){flat.push(cur);cur=null;}flat.push(ln.trim());}
    else if(cur!=null&&ln.trim())cur+=" "+ln.trim();
    else if(cur==null&&ln.trim())intro.push(ln.trim());
  }
  if(cur!=null)flat.push(cur);
  let rows="",any=false,legend=false;
  for(const raw of flat){
    const g=raw.match(/^\*\*(.+?)\*\*:?\s*$/);
    if(g){rows+=`<div class="grp">${esc(g[1].replace(/:$/,""))}</div>`;continue;}
    const m=raw.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);if(!m)continue;
    const it=parseAct(m[1]);if(!it.plain)continue;
    any=true;if(it.notPhone)legend=true;
    rows+=actRow(it);
  }
  if(!any)return eyeList(body);
  return (intro.length?`<p class="why" style="margin:-2px 0 10px">${inline(intro.join(" "))}</p>`:"")
   +(legend?`<div class="legend">${ic("bolt",14)}<span><b>Add to Todoist</b> — the item is on the vault's list but was never pushed to your phone, so it will not show up in Todoist and nothing will remind you. Tap it and the next sync puts it there.</span></div>`:"")
   +`<div class="rows">${rows}</div>`;
}

function softCard(body){const its=collectItems(body);const intro=body.find(l=>l.trim()&&!/^\s*[-*]/.test(l));
  return `<div class="card soft">${intro?`<p class="why" style="margin-top:0">${inline(intro)}</p>`:""}${its.map(i=>`<p class="lineitem">${inline(i)}</p>`).join("")}</div>`;}
function eyeList(body){const its=collectItems(body);return (its.length?its:[body.join(" ").trim()]).filter(Boolean).map(i=>`<p class="eye">${inline(i)}</p>`).join("");}
function missed(body){return collectItems(body).map(it=>{const p=it.split(/\s+—\s+/);const title=p.shift();
  let why=p.join(" — ").replace(/\s*(?:→|->)\s*\[\[[^\]]+\]\]\s*$/,"").replace(/\[\[([^\]]+)\]\]/g,(_,m)=>m.split("|").pop());
  return `<div class="card miss">${ic("alert",18)}<div><p class="mt">${inline(title)}</p>${why.trim()?`<p class="why">${inline(why)}</p>`:""}</div></div>`;}).join("");}

function asks(body){let html="",i=0;const L=body;
  while(i<L.length){
    if(/^>\s*\[!ask\]/i.test(L[i])){
      const head=L[i].replace(/^>\s*\[!ask\]\s*/i,"");i++;const q=[];
      while(i<L.length&&/^>/.test(L[i])){const inn=L[i].replace(/^>\s?/,"").replace(/^>\s?/,"");
        if(inn.trim()&&!/^reply:/i.test(inn))q.push(inn);i++;}
      let anchor="";
      if(i<L.length&&/^\^ask-/.test(L[i].trim())){anchor=L[i].trim().slice(1);i++;}
      // Stable key: prefer the ^ask- block id so a carried-over question keeps its reply history.
      const k=anchor?keyOf(anchor):keyOf(plain(head)+plain(q.join(" ")).slice(0,80));
      const answered=sentFor(k).length>0;
      html+=`<div class="ask ${answered?"answered":""}" data-key="${k}">
        <div class="ah">${ic("spark",15)} ${esc(head)}</div>
        <p class="aq">${inline(q.join(" "))}</p>
        <div class="sent" data-sent="${k}">${sentInner(k)}</div>
        <div class="reply">
          <input placeholder="${answered?"Add another…":"yes / no / a note…"}" data-anchor="${att(anchor?"^"+anchor:"")}" data-ask="${att((plain(q.join(" ")).replace(/\s+/g," ").trim()||plain(head)).slice(0,120))}" data-key="${k}" />
          <button class="send" data-send-ask>${ic("arrow",16)}</button>
        </div>
      </div>`;
    } else i++;
  }
  return html;}

// Priority
// Rows carry only what you scan for: the title and what happens next. Status, signal age
// and the vault note are one tap away in the detail sheet, so the board stays readable.
let REG=null;
const BUCKETS=[["hot","Hot"],["warm","Warm"],["cooling","Cooling"],["on_deck","On Deck"],
  ["parked","Parked"],["stood_down","Stood Down"],["dead","Dead"]];

function openTopic(i){

// ---- pipeline heartbeat -------------------------------------------------
// sync-job.mjs publishes sync-status.json every run. The app watches its AGE, which catches a
// stalled pipeline whatever the cause — including a broken push, where no error could reach us.
let SYNC=null;
const relAge=ms=>{const m=Math.round(ms/60000);
  if(m<1)return "now"; if(m<60)return m+"m";
  const h=Math.round(m/60); if(h<48)return h+"h"; return Math.round(h/24)+"d";};
function renderSync(){
  const pill=$("#syncpill"),age=$("#sync-age");
  if(!SYNC||!SYNC.at){pill.className="";age.textContent="?";return;}
  const ms=Date.now()-Date.parse(SYNC.at);
  pill.className=ms<30*60000?"ok":ms<3*3600000?"warn":"bad";
  age.textContent=relAge(ms);
}
function openSync(){
  const b=$("#sy-body");
  if(!SYNC||!SYNC.at){
    b.innerHTML=`<div class="dl"><span class="dk">No status</span><span class="dv">The sync job hasn't published <code>sync-status.json</code>. Either it has never run since this was added, or the machine is running an older copy of the script.</span></div>`;
    $("#sync").showModal();return;}
  const ms=Date.now()-Date.parse(SYNC.at);
  const p=SYNC.pushes||{},a=SYNC.applied||{},pub=SYNC.published||{},sc=SYNC.script||{};
  const bad=v=>/^failed/i.test(v||"")?`<span style="color:var(--hot)">${esc(v)}</span>`:esc(v||"—");
  const rows=[
    ["Last run",`${ms<60000?"just now":relAge(ms)+" ago"} · ${new Date(SYNC.at).toLocaleString()}${
      ms>3*3600000?'<br><span style="color:var(--hot)">Stalled — nothing has run in hours.</span>':""}`],
    ["Published",`${pub.today?esc(pub.today):"no daily note"} · ${pub.register_topics??"?"} topics · ${pub.review_items??"?"} reviews · ${pub.receipts??"?"} receipts`],
    ["Applied",`${a.intents||0} intent${a.intents===1?"":"s"}${a.voice?`, ${a.voice} voice`:""}${a.cleared?`, ${a.cleared} cleared`:""}`],
    ["Pull",bad(SYNC.pull)],
    ["Push · data",bad(p.data)],
    ["Push · app shell",bad(p.app)],
    ["Script",`v${esc(sc.version||"?")}<br><code>${esc(sc.path||"?")}</code>${
      sc.modified?`<br><span style="color:var(--faint)">modified ${new Date(sc.modified).toLocaleString()}</span>`:""}`],
  ];
  if(SYNC.notes&&SYNC.notes.length)rows.push(["Notes",SYNC.notes.map(esc).join("<br>")]);
  b.innerHTML=rows.map(([k,v])=>`<div class="dl"><span class="dk">${k}</span><span class="dv">${v}</span></div>`).join("");
  $("#sync").showModal();
}

// ---- Review queue -------------------------------------------------------
// The vault stays the source of truth. Resolving here appends a `## Resolution` section to the
// note, which is one of the orchestrator's three resolution signals — identical to typing it in
// Obsidian. Nothing here is a parallel state store, and answering in either place works.
let RVQ=null;
const RV_PRESETS=[
  "No action needed — close this out.",
  "Yes — create the person note.",
  "Stakeholder Map only, no card.",
  "Not now — ask me again in a month.",
];
function mdBlock(src){
  const out=[];let list=null;
  const flush=()=>{if(list!=null){out.push(`<ul class="mdul">${list}</ul>`);list=null;}};
  for(const raw of String(src||"").split("\n")){
    const t=raw.trim();
    if(!t){flush();continue;}
    let m;
    if(m=t.match(/^(#{1,4})\s+(.*)/)){flush();out.push(`<p class="mdh">${inline(m[2])}</p>`);continue;}
    if(m=t.match(/^>\s?\[!(\w+)\]\s*(.*)/)){flush();out.push(`<div class="mdq"><strong>${esc(m[1])}</strong> ${inline(m[2])}</div>`);continue;}
    if(m=t.match(/^>\s?(.*)/)){flush();out.push(`<div class="mdq">${inline(m[1])}</div>`);continue;}
    if(m=t.match(/^[-*]\s+\[( |x)\]\s+(.*)/i)){flush();
      out.push(`<p class="mdtask">${m[1].toLowerCase()==="x"?"☑":"☐"} ${inline(m[2])}</p>`);continue;}
    if(m=t.match(/^[-*]\s+(.*)/)){list=(list||"")+`<li>${inline(m[1])}</li>`;continue;}
    flush();out.push(`<p class="mdp">${inline(t)}</p>`);
  }
  flush();return out.join("");
}
const rvKey=file=>keyOf("rv:"+file);
const rvDone=file=>sentFor(rvKey(file)).some(e=>e.type==="review");
function renderReview(){
  const el=$("#view-review");
  if(!RVQ||!RVQ.items){el.innerHTML='<div class="empty">No review queue yet.<br><span style="font-size:13px">It appears after the next sync.</span></div>';return;}
  const open=RVQ.items.filter(i=>!rvDone(i.file));
  const done=RVQ.items.filter(i=>rvDone(i.file));
  if(!RVQ.items.length){el.innerHTML='<div class="empty">Review queue is clear.</div>';return;}
  const card=i=>{
    const d=rvDone(i.file);
    const age=i.days!=null?`${i.days}d`:"";
    return `<button class="rvcard${d?" done":""}" data-rv="${att(i.file)}">
      <span class="rvtop"><span class="chip">${esc(i.kind)}</span>${
        d?`<span class="chip ok">${ic("check",12)} Resolved</span>`:""}
        <span class="rvage${i.days>=30?" old":""}">${esc(age)}</span></span>
      <span class="rvt">${esc(i.title)}</span>
      ${i.question?`<span class="rvq">${inline(i.question)}</span>`:""}
    </button>`;};
  let html=`<div class="rvhead"><b>${open.length} to review</b><span>${
    open.length?`oldest ${Math.max(...open.map(i=>i.days||0))} days`:"all clear"}</span></div>`;
  html+=open.map(card).join("");
  if(done.length)html+=`<div class="sec" style="margin-top:22px">${ic("check")}<span>Resolved, awaiting sweep</span><span class="n">${done.length}</span></div>`+done.map(card).join("");
  el.innerHTML=html;
}
function openReview(file){
  const it=RVQ&&RVQ.items.find(i=>i.file===file);if(!it)return;
  $("#rv-title").textContent=it.title;
  $("#rv-meta").innerHTML=`${esc(it.kind)}${it.date?` · ${esc(it.date)}`:""}${
    it.days!=null?` · ${it.days} days old`:""}${it.source?` · via ${esc(it.source)}`:""}`;
  $("#rv-body").innerHTML=mdBlock(it.body);
  const prior=sentFor(rvKey(it.file)).filter(e=>e.type==="review");
  $("#rv-presets").innerHTML=RV_PRESETS.map(t=>`<button class="preset" data-preset="${att(t)}">${esc(t)}</button>`).join("");
  const a=$("#rv-answer");a.value="";a.dataset.file=it.file;a.dataset.title=it.title;
  $("#rv-foot").innerHTML=prior.length
    ? `Already resolved${prior[prior.length-1].remote?" from your other device":""}: “${esc(prior[prior.length-1].text)}”. Sending again appends a note instead.`
    : `Writes a <code>## Resolution</code> section into <code>${esc(it.file)}</code>. The Librarian actions it and archives the note on the next run — the same as answering in Obsidian.`;
  $("#review").showModal();$("#review").scrollTop=0;
}
async function resolveReview(){
  const a=$("#rv-answer");const v=a.value.trim();if(!v){toast("Write a decision first");return;}
  const file=a.dataset.file,k=rvKey(file);
  const btn=$("#rv-resolve");btn.disabled=true;
  try{
    const id=await sendIntent({type:"review_resolve",target:file,text:v,key:k,label:a.dataset.title});
    recordSent({id,key:k,type:"review",label:a.dataset.title,text:v});
    $("#review").close();renderReview();toast("Resolved");
  }catch(e){toast(e.message==="nocfg"?"Connect your repo first":"Failed");}
  finally{btn.disabled=false;}
}

// Sent
function renderSentView(){
  const l=allSent().slice().sort((a,b)=>b.ts-a.ts);
  if(!l.length){$("#view-sent").innerHTML='<div class="empty">Nothing sent yet.<br><span style="font-size:13px">Replies, notes, pushes and captures land here so you can see what you already said.</span></div>';return;}
  let html='<p class="orient" style="margin:0">Everything sent to the vault, from any device. Applied history comes from the repo; this device also keeps its own copy for 45 days.</p>',day="";
  for(const e of l){
    const d=fmtD(e.ts);
    if(d!==day){day=d;html+=`<div class="daylbl">${esc(d)}</div>`;}
    const tag=e.remote?`<span class="chip" style="margin-left:6px">${e.pending?"other device · pending sync":"other device"}</span>`:"";
    html+=`<div class="scard"><div class="sh">${ic("plane",12)} ${SENTLBL[e.type]||esc(e.type)}${tag}<span class="tm">${fmtT(e.ts)}</span></div>`
      +(e.label?`<div class="stg">${esc(e.label)}</div>`:"")
      +(e.text?`<div class="stx">${esc(e.text)}</div>`:"")+`</div>`;
  }
  html+=`<button class="clearbtn" id="sent-clear">Clear this device's local copy</button>`;
  html+=`<p class="rvfoot">Clearing only drops the local cache. Anything already applied stays in the repo's receipts and will reappear on the next sync.</p>`;
  $("#view-sent").innerHTML=html;
}

async function load(){
  const cN=localStorage.op_today,cR=localStorage.op_reg,cV=localStorage.op_review,cS=localStorage.op_status;
  if(cS){try{SYNC=JSON.parse(cS);}catch{}}
  REMOTE=remoteCache();          // last-known cross-device receipts, so the first paint is honest
  renderSync();
  if(cN)$("#view-today").innerHTML=renderToday(cN);
  if(cR)renderPriority(JSON.parse(cR));
  if(cV){try{RVQ=JSON.parse(cV);}catch{}}
  renderReview();renderSentView();renderRec();
  if(!have()){$("#view-today").innerHTML='<div class="empty">Tap ⚙ to connect your repo.</div>';return;}
  // loadRemote() rides along in the same batch and must settle BEFORE renderToday: the ask
  // cards and the Todoist chips read sentFor() as they build, so a late arrival would paint
  // a card as unanswered that the other device already answered.
  try{const[note,reg,rev,sta]=await Promise.all([
      ghGet("today.md").catch(()=>cN||""),
      ghGet("priority-register.json").catch(()=>cR||""),
      ghGet("review-queue.json").catch(()=>cV||""),
      ghGet("sync-status.json").catch(()=>""),
      loadRemote().catch(()=>{})]);
    if(sta){localStorage.op_status=sta;try{SYNC=JSON.parse(sta);}catch{}}
    renderSync();
    if(note){localStorage.op_today=note;$("#view-today").innerHTML=renderToday(note);}
    if(reg){localStorage.op_reg=reg;renderPriority(JSON.parse(reg));}
    if(rev){localStorage.op_review=rev;try{RVQ=JSON.parse(rev);}catch{}}
    renderReview();renderSentView();}
  catch(e){toast("Sync failed — showing cached");}
}

// interactions
document.addEventListener("click",async e=>{
  const tab=e.target.closest(".tabs button");
  if(tab){const v=tab.dataset.v;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b===tab));
    $("#htitle").textContent={today:"Today",priority:"Priority",review:"Review",capture:"Capture",sent:"Sent"}[v];
    $("#view-today").hidden=v!=="today";$("#view-priority").hidden=v!=="priority";
    $("#view-review").hidden=v!=="review";
    $("#view-capture").hidden=v!=="capture";$("#view-sent").hidden=v!=="sent";
    if(v==="sent")renderSentView();
    if(v==="review")renderReview();
    window.scrollTo(0,0);return;}

  const rv=e.target.closest("[data-rv]");
  if(rv){openReview(rv.dataset.rv);return;}
  const pz=e.target.closest("[data-preset]");
  if(pz){const a=$("#rv-answer");a.value=a.value.trim()?a.value.trim()+" "+pz.dataset.preset:pz.dataset.preset;a.focus();return;}
  if(e.target.id==="rv-resolve"){resolveReview();return;}
  if(e.target.id==="rv-close"){$("#review").close();return;}

  const pr=e.target.closest("[data-topic]");
  if(pr){openTopic(+pr.dataset.topic);return;}

  const cb=e.target.closest(".cb");
  if(cb&&!cb.classList.contains("done")){
    try{const id=await sendIntent({type:"complete",target:cb.dataset.done,key:cb.dataset.key,label:cb.dataset.done});
      cb.classList.add("done");cb.innerHTML=ic("checkfill",20);
      recordSent({id,key:cb.dataset.key,type:"complete",label:cb.dataset.done,text:""});
      refreshSent(cb.dataset.key);toast("Marked done");}catch{toast("Failed");}
    return;}

  const push=e.target.closest("[data-push]");
  if(push){const t=push.dataset.push,k=push.dataset.key;push.disabled=true;
    try{const id=await sendIntent({type:"phone_this",target:t,key:k,label:t});
      recordSent({id,key:k,type:"phone_this",label:t,text:""});
      push.outerHTML=`<span class="chip ok">${ic("check",12)} Queued for Todoist</span>`;
      refreshSent(k);toast("Pushing to Todoist on next sync");}
    catch{push.disabled=false;toast("Failed");}
    return;}

  const nb=e.target.closest("[data-note]");
  if(nb){const box=document.querySelector(`[data-nf="${nb.dataset.note}"]`);
    if(box){box.hidden=!box.hidden;if(!box.hidden)box.querySelector("input").focus();}
    return;}

  const sn=e.target.closest("[data-send-note]");
  if(sn){const inp=sn.previousElementSibling;const v=inp.value.trim();if(!v)return;
    const k=inp.dataset.key;
    try{const id=await sendIntent({type:"comment",target:inp.dataset.target,text:v,key:k,label:inp.dataset.target});
      recordSent({id,key:k,type:"comment",label:inp.dataset.target,text:v});
      inp.value="";inp.blur();sn.closest(".reply").hidden=true;
      refreshSent(k);toast("Note sent");}catch{toast("Failed");}
    return;}

  const sa=e.target.closest("[data-send-ask]");
  if(sa){const inp=sa.previousElementSibling;const v=inp.value.trim();if(!v)return;
    const k=inp.dataset.key;
    // The ^ask- block id is the ONLY thing that ties a reply back to its card. Every card
    // in a "Let's talk" section shares the same [!ask] header line, so sending the header
    // (what this did until 2026-07-27) makes four replies indistinguishable in the vault.
    const anc=inp.dataset.anchor||"";
    try{const id=await sendIntent({type:"reply",target:anc||inp.dataset.ask,anchor:anc,label:inp.dataset.ask,text:v,key:k});
      recordSent({id,key:k,type:"reply",label:inp.dataset.ask,text:v});
      inp.value="";inp.blur();inp.placeholder="Add another…";
      const card=sa.closest(".ask");if(card)card.classList.add("answered");
      refreshSent(k);toast("Reply sent");}catch{toast("Failed");}
    return;}

  if(e.target.id==="tc-send"){const ta=$("#today-comment");const v=ta.value.trim();if(!v)return;
    try{const id=await sendIntent({type:"comment",text:v,key:"__comment",label:"Today's note"});
      recordSent({id,key:"__comment",type:"comment",label:"Today's note",text:v});
      ta.value="";ta.blur();refreshSent("__comment");toast("Comment sent");}catch{toast("Failed");}
    return;}

  if(e.target.closest("#rec-start")||e.target.closest("#rec-retry")){startRec();return;}
  if(e.target.closest("#rec-stop")){stopRec();return;}
  if(e.target.closest("#rec-send")){sendRec();return;}
  if(e.target.closest("#rec-again")){resetRec();startRec();return;}
  if(e.target.closest("#rec-drop")){resetRec();toast("Discarded");return;}

  if(e.target.id==="tp-more"){const st=$("#tp-status");const open=st.classList.toggle("clamp");
    e.target.textContent=open?"Show all":"Show less";return;}

  if(e.target.id==="sent-clear"){localStorage.removeItem(OB);renderSentView();
    // Repaint from REMOTE rather than blanking: the repo's receipts survive a local clear.
    document.querySelectorAll("[data-sent]").forEach(n=>{const k=n.dataset.sent;n.innerHTML=k?sentInner(k):"";});
    toast("Local copy cleared");return;}
});

// ---- voice notes -------------------------------------------------------
// Records in-app and PUTs the audio straight into the repo's inbox/. The sync job
// moves it into 00_Inbox/, where the existing audio-intake pass transcribes it exactly
// as it does a Shortcut drop. This path never touches the iCloud mount.
const MAXSEC=600;
let RS={state:"idle",chunks:[],rec:null,stream:null,secs:0,tick:null,blob:null,url:"",ext:"m4a",err:""};
const fmtDur=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const sizeLbl=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";

function renderRec(){
  const el=$("#rec");if(!el)return;
  if(RS.state==="recording"){
    const near=RS.secs>=MAXSEC-120;
    el.innerHTML=`<div class="reclive"><span class="recdot"></span>
      <span class="rectime" id="rec-time">${fmtDur(RS.secs)}</span>
      <button class="recstop" id="rec-stop">${ic("stop",16)} Stop</button></div>
      <p class="rechint${near?" warn":""}">${near?"Auto-stops at 10:00.":"Recording. Tap Stop when you're done."}</p>`;
  } else if(RS.state==="review"){
    el.innerHTML=`<div class="recreview"><audio controls preload="metadata" src="${RS.url}"></audio>
      <p class="rechint" style="margin-top:9px">${fmtDur(RS.secs)} · ${sizeLbl(RS.blob.size)}</p>
      <div class="recrow"><button class="primary" id="rec-send">Send voice note</button>
        <button class="ghostbtn" id="rec-again">Redo</button>
        <button class="ghostbtn" id="rec-drop">Discard</button></div></div>`;
  } else if(RS.state==="sending"){
    el.innerHTML=`<div class="recreview"><p class="rechint" style="margin:0">Uploading ${sizeLbl(RS.blob.size)}…</p></div>`;
  } else if(RS.state==="blocked"){
    el.innerHTML=`<div class="recreview"><p class="rechint" style="margin:0">${esc(RS.err)}</p>
      <div class="recrow"><button class="ghostbtn" id="rec-retry">Try again</button></div></div>`;
  } else {
    el.innerHTML=`<button class="recbtn" id="rec-start">${ic("mic",21)} Record a voice note</button>
      <p class="rechint">Lands in your inbox and gets transcribed on the next run, same as a Shortcut drop. Up to 10 minutes.</p>`;
  }
}
function resetRec(){
  if(RS.url)URL.revokeObjectURL(RS.url);
  clearInterval(RS.tick);
  RS={state:"idle",chunks:[],rec:null,stream:null,secs:0,tick:null,blob:null,url:"",ext:RS.ext,err:""};
  renderRec();
}
async function startRec(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
    RS.state="blocked";RS.err="This browser can't record audio. Drop the memo through your Shortcut instead.";renderRec();return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){RS.state="blocked";
    RS.err=(e&&e.name==="NotAllowedError")
      ? "Microphone permission denied. Allow it for this site, then try again."
      : "Couldn't open the microphone"+(e&&e.name?` (${e.name})`:"")+". Drop the memo through your Shortcut instead.";
    renderRec();return;}
  let mt="";
  for(const c of ["audio/mp4","audio/aac","audio/mpeg","audio/webm;codecs=opus","audio/webm"])
    if(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(c)){mt=c;break;}
  RS.ext=(!mt||/mp4|aac/.test(mt))?"m4a":(/mpeg/.test(mt)?"mp3":"webm");
  let rec;
  try{rec=mt?new MediaRecorder(stream,{mimeType:mt,audioBitsPerSecond:32000}):new MediaRecorder(stream);}
  catch(e){try{rec=new MediaRecorder(stream);RS.ext="m4a";}
    catch(e2){stream.getTracks().forEach(t=>t.stop());
      RS.state="blocked";RS.err="Recording isn't supported here. Use your Shortcut instead.";renderRec();return;}}
  RS.chunks=[];RS.rec=rec;RS.stream=stream;RS.secs=0;RS.state="recording";
  rec.ondataavailable=e=>{if(e.data&&e.data.size)RS.chunks.push(e.data);};
  rec.onstop=()=>{
    clearInterval(RS.tick);RS.tick=null;
    try{RS.stream.getTracks().forEach(t=>t.stop());}catch{}
    RS.blob=new Blob(RS.chunks,{type:mt||"audio/mp4"});
    if(!RS.blob.size){RS.state="blocked";RS.err="Nothing was recorded. Try again.";renderRec();return;}
    RS.url=URL.createObjectURL(RS.blob);RS.state="review";renderRec();};
  rec.start();renderRec();
  RS.tick=setInterval(()=>{
    RS.secs++;
    const t=$("#rec-time");if(t)t.textContent=fmtDur(RS.secs);
    if(RS.secs===MAXSEC-120)renderRec();
    if(RS.secs>=MAXSEC)stopRec();},1000);
}
function stopRec(){clearInterval(RS.tick);RS.tick=null;
  if(RS.rec&&RS.rec.state!=="inactive"){try{RS.rec.stop();}catch{}}}
async function sendRec(){
  if(!RS.blob)return;
  const secs=RS.secs,blob=RS.blob;
  RS.state="sending";renderRec();
  try{
    const name=`${stampName()}.${RS.ext}`;
    await ghPutB64(`inbox/${name}`,await blobB64(blob),`voice capture: ${name}`);
    recordSent({key:"__voice",type:"voice",label:`${fmtDur(secs)} · ${name}`,text:""});
    resetRec();toast("Voice note sent");
  }catch(e){RS.state="review";renderRec();toast(e.message==="nocfg"?"Connect your repo first":"Upload failed");}
}

$("#cap-send").onclick=async()=>{const v=$("#cap").value.trim();if(!v)return;
  try{const id=await sendIntent({type:"capture",text:v,key:"__capture"});
    recordSent({id,key:"__capture",type:"capture",label:"",text:v});
    $("#cap").value="";$("#cap").blur();toast("Captured");}catch{toast("Failed");}};
$("#reload").onclick=load;
function openSettings(){const c=cfg();$("#cfg-owner").value=c.owner;$("#cfg-repo").value=c.repo;$("#cfg-token").value=c.token;$("#settings").showModal();}
$("#syncpill").onclick=openSync;$("#sy-close").onclick=()=>$("#sync").close();
setInterval(renderSync,60000);            // let the age tick over while the app sits open
$("#gear").onclick=openSettings;$("#cfg-close").onclick=()=>$("#settings").close();
$("#tp-close").onclick=()=>$("#topic").close();
// tap the backdrop to dismiss either sheet
for(const d of [$("#topic"),$("#settings"),$("#review"),$("#sync")])d.addEventListener("click",e=>{if(e.target===d)d.close();});
$("#cfg-save").onclick=()=>{localStorage.op_owner=$("#cfg-owner").value.trim();localStorage.op_repo=$("#cfg-repo").value.trim();localStorage.op_token=$("#cfg-token").value.trim();$("#settings").close();toast("Saved");load();};
// Enter sends from any single-line reply field
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;const i=e.target.closest(".reply input");if(!i)return;
  e.preventDefault();i.nextElementSibling.click();});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
load();
</script>
